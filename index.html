<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Store | Premium E-Commerce</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 60px;
        }

        header {
            background-color: var(--bg-card);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        nav button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; }
        .card p { color: var(--accent); font-weight: bold; font-size: 1.2rem; margin-bottom: 1rem; }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }

        .btn-danger {
            background-color: var(--danger);
            color: #fff;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 { margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.6rem;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 4px;
        }

        /* Admin Panel */
        .admin-section {
            display: none;
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        table, th, td { border: 1px solid var(--border); }
        th, td { padding: 0.75rem; text-align: left; }
        th { background: var(--bg-main); }

        /* Chatbot */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 300;
        }

        .chat-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .chat-box {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 0;
            width: 300px;
            height: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            flex-direction: column;
        }

        .chat-header {
            background: var(--bg-main);
            padding: 0.75rem;
            font-weight: bold;
            border-bottom: 1px solid var(--border);
        }

        .chat-messages {
            flex: 1;
            padding: 0.75rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .msg { padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; max-width: 80%; }
        .msg.bot { background: var(--border); align-self: flex-start; }
        .msg.user { background: var(--accent); color: #000; align-self: flex-end; }

        .chat-input {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .chat-input input {
            flex: 1;
            padding: 0.5rem;
            background: transparent;
            border: none;
            color: var(--text-main);
        }

        .chat-input button {
            padding: 0.5rem 1rem;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Luxury Store</div>
        <nav>
            <button onclick="openModal('adminModal')">Admin Login</button>
        </nav>
    </header>

    <div class="container">
        <h2>পণ্যসমূহ</h2>
        <br>
        <div class="grid" id="productGrid"></div>

        <!-- Admin Panel Area -->
        <div class="admin-section" id="adminPanel">
            <h2>অ্যাডমিন কন্ট্রোল প্যানেল</h2>
            <br>
            <h3>নতুন প্রোডাক্ট যোগ করুন</h3>
            <div class="form-group"><input type="text" id="pName" placeholder="প্রোডাক্ট নাম"></div>
            <div class="form-group"><input type="number" id="pPrice" placeholder="মূল্য (টাকা)"></div>
            <div class="form-group"><input type="text" id="pImg" placeholder="ইমেজ URL (যেমন: https://via.placeholder.com/150)"></div>
            <button class="btn" onclick="addProduct()">প্রোডাক্ট আপলোড করুন</button>
            
            <br><hr><br>
            <h3>গ্রাহকদের অর্ডারের তালিকা</h3>
            <table id="orderTable">
                <thead>
                    <tr>
                        <th>নাম</th>
                        <th>মোবাইল</th>
                        <th>পেমেন্ট মেথড</th>
                        <th>TrxID / নম্বর</th>
                        <th>প্রোডাক্ট</th>
                        <th>স্ট্যাটাস</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- Buy Modal -->
    <div class="modal" id="buyModal">
        <div class="modal-content">
            <h2>অর্ডার কনফার্মেশন</h2>
            <div class="form-group">
                <label>আপনার নাম</label>
                <input type="text" id="custName" required>
            </div>
            <div class="form-group">
                <label>মোবাইল নম্বর</label>
                <input type="text" id="custPhone" required>
            </div>
            <div class="form-group">
                <label>পেমেন্ট মেথড সিলেক্ট করুন</label>
                <select id="payMethod">
                    <option value="bKash">bKash (বিকাশ)</option>
                    <option value="Rocket">Rocket (রকেট)</option>
                    <option value="Nagad">Nagad (নগদ)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Transaction ID / প্রেরকের নম্বর</label>
                <input type="text" id="payDetails" required>
            </div>
            <button class="btn" onclick="submitOrder()">অর্ডার নিশ্চিত করুন</button>
            <br><br>
            <button class="btn btn-danger" onclick="closeModal('buyModal')">বন্ধ করুন</button>
        </div>
    </div>

    <!-- Admin Login Modal -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>অ্যাডমিন লগইন</h2>
            <div class="form-group">
                <label>পাসওয়ার্ড প্রবেশ করুন (Default: admin123)</label>
                <input type="password" id="adminPass">
            </div>
            <button class="btn" onclick="loginAdmin()">লগইন</button>
            <br><br>
            <button class="btn btn-danger" onclick="closeModal('adminModal')">বন্ধ করুন</button>
        </div>
    </div>

    <!-- Chatbot -->
    <div class="chat-widget">
        <div class="chat-box" id="chatBox">
            <div class="chat-header">Luxury Store AI Support</div>
            <div class="chat-messages" id="chatMsgs">
                <div class="msg bot">হ্যালো! কিভাবে সাহায্য করতে পারি?</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInp" placeholder="মেসেজ লিখুন...">
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
        <button class="chat-btn" onclick="toggleChat()">💬</button>
    </div>

    <script>
        // Initial Data
        let products = JSON.parse(localStorage.getItem('products')) || [
            { id: 1, name: 'Premium Luxury Watch', price: 2500, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300' },
            { id: 2, name: 'Wireless Headphones', price: 1800, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300' }
        ];

        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        let selectedProduct = null;

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}">
                        <h3>${p.name}</h3>
                        <p>${p.price} ৳</p>
                        <button class="btn" onclick="openBuyModal(${p.id})">Buy Now</button>
                        ${document.getElementById('adminPanel').style.display === 'block' ? 
                        `<br><button class="btn btn-danger" onclick="deleteProduct(${p.id})">Delete</button>` : ''}
                    </div>
                `;
            });
            localStorage.setItem('products', JSON.stringify(products));
        }

        function openBuyModal(id) {
            selectedProduct = products.find(p => p.id === id);
            openModal('buyModal');
        }

        function submitOrder() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const method = document.getElementById('payMethod').value;
            const details = document.getElementById('payDetails').value;

            if(!name || !phone || !details) {
                alert('সকল তথ্য সঠিকভাবে পূরণ করুন।');
                return;
            }

            const newOrder = {
                id: Date.now(),
                name, phone, method, details,
                product: selectedProduct.name,
                status: 'Pending'
            };

            orders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(orders));
            alert('আপনার অর্ডার সফলভাবে সম্পন্ন হয়েছে!');
            closeModal('buyModal');
            renderOrders();
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if(pass === 'admin123') {
                document.getElementById('adminPanel').style.display = 'block';
                closeModal('adminModal');
                renderProducts();
                renderOrders();
                alert('অ্যাডমিন মোড চালু হয়েছে।');
            } else {
                alert('ভুল পাসওয়ার্ড!');
            }
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value || 'https://via.placeholder.com/150';

            if(name && price) {
                products.push({ id: Date.now(), name, price, img });
                renderProducts();
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImg').value = '';
            }
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            renderProducts();
        }

        function renderOrders() {
            const tbody = document.querySelector('#orderTable tbody');
            tbody.innerHTML = '';
            orders.forEach(o => {
                tbody.innerHTML += `
                    <tr>
                        <td>${o.name}</td>
                        <td>${o.phone}</td>
                        <td>${o.method}</td>
                        <td>${o.details}</td>
                        <td>${o.product}</td>
                        <td>${o.status}</td>
                    </tr>
                `;
            });
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function toggleChat() {
            const box = document.getElementById('chatBox');
            box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendChat() {
            const inp = document.getElementById('chatInp');
            const msgs = document.getElementById('chatMsgs');
            if(inp.value.trim()) {
                msgs.innerHTML += `<div class="msg user">${inp.value}</div>`;
                const userTxt = inp.value.toLowerCase();
                inp.value = '';
                setTimeout(() => {
                    let reply = "ধন্যবাদ মেসেজের জন্য। আমাদের প্রতিনিধি দ্রুত যোগাযোগ করবে।";
                    if(userTxt.includes("bkash") || userTxt.includes("পেমেন্ট")) reply = "আপনি বিকাশ, রকেট বা নগদের মাধ্যমে পেমেন্ট করতে পারবেন।";
                    msgs.innerHTML += `<div class="msg bot">${reply}</div>`;
                    msgs.scrollTop = msgs.scrollHeight;
                }, 1000);
            }
        }

        renderProducts();
    </script>
</body>
</html>
