<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXORA | Exclusive E-Commerce</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0c10;
      --bg-card: #12141c;
      --accent: #d4af37;
      --accent-hover: #f3e5ab;
      --text-main: #f5f5f7;
      --text-muted: #a0a5b5;
      --border: rgba(212, 175, 55, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.6;
    }
    .announcement-bar {
      background: var(--accent);
      color: #000;
      text-align: center;
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 5%;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 12, 16, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--text-main);
      text-decoration: none;
    }
    nav button {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      margin-left: 15px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    nav button:hover { color: var(--accent); }
    .container { padding: 40px 5%; max-width: 1200px; margin: 0 auto; }
    .section-title {
      font-family: 'Cinzel', serif;
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 25px;
    }
    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 15px;
    }
    .product-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .product-price { color: var(--accent); font-weight: 700; font-size: 18px; margin-bottom: 12px; }
    .btn {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover { background: var(--accent-hover); }
    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }
    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 25px;
      width: 90%;
      max-width: 450px;
      border-radius: 8px;
    }
    .input-field {
      width: 100%;
      padding: 10px;
      margin: 8px 0 15px 0;
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="announcement-bar">
    COMPLIMENTARY EXPRESS SHIPPING | SECURE COD, BKASH, NAGAD & ROCKET AVAILABLE
  </div>

  <header>
    <a href="#" class="logo">LUXORA</a>
    <nav>
      <button onclick="renderProducts()">SHOP</button>
      <button onclick="openAdminModal()">ADMIN</button>
      <button onclick="clearAndResetData()" style="color: #ff5555;">RESET DATA</button>
    </nav>
  </header>

  <div class="container">
    <h2 class="section-title">EXCLUSIVE COLLECTIONS</h2>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- Admin Modal -->
  <div class="modal" id="adminModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 15px; text-align: center;">Add New Product</h3>
      <input type="text" id="pTitle" class="input-field" placeholder="Product Title">
      <input type="number" id="pPrice" class="input-field" placeholder="Price ($)">
      <input type="text" id="pImg" class="input-field" placeholder="Image URL">
      <button class="btn" onclick="addNewProduct()">Save Product</button>
      <button class="btn" style="background: #333; color: #fff; margin-top: 8px;" onclick="closeAdminModal()">Close</button>
    </div>
  </div>

  <script>
    const defaultProducts = [
      { id: 1, name: "Royal Diamond Watch", price: 499, image: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500" },
      { id: 2, name: "Luxury Leather Bag", price: 299, image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500" },
      { id: 3, name: "Gold Chronograph", price: 650, image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500" }
    ];

    function getProducts() {
      const stored = localStorage.getItem('luxora_products_v2');
      if (!stored) {
        localStorage.setItem('luxora_products_v2', JSON.stringify(defaultProducts));
        return defaultProducts;
      }
      return JSON.parse(stored);
    }

    function renderProducts() {
      const products = getProducts();
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';
      products.forEach(p => {
        const title = p.name || p.title || 'Exclusive Product';
        const img = p.image || p.img || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500';
        const price = p.price || 0;

        grid.innerHTML += `
          <div class="product-card">
            <img src="${img}" class="product-img" alt="${title}">
            <div>
              <div class="product-title">${title}</div>
              <div class="product-price">$${price}</div>
            </div>
            <button class="btn">Order Now</button>
          </div>
        `;
      });
    }

    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

    function addNewProduct() {
      const name = document.getElementById('pTitle').value;
      const price = document.getElementById('pPrice').value;
      const image = document.getElementById('pImg').value || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500';

      if(!name || !price) { alert('Please enter title and price'); return; }

      const products = getProducts();
      products.push({ id: Date.now(), name, price: Number(price), image });
      localStorage.setItem('luxora_products_v2', JSON.stringify(products));
      
      closeAdminModal();
      renderProducts();
    }

    function clearAndResetData() {
      localStorage.clear();
      localStorage.setItem('luxora_products_v2', JSON.stringify(defaultProducts));
      renderProducts();
      alert('Product data reset successfully!');
    }

    window.onload = renderProducts;
  </script>
</body>
</html>
